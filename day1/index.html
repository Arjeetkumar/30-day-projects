<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Glass Calculator By Arjeet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header class="header">
        <h2>Glass Calculator</h2>
    </header>

    <div class="calculator">
        <div class="display">
            <div id="expression"></div>
            <div id="result"></div>
        </div>

        <div class="keys">
            <button class="btn small" data-action="clear">C</button>
            <button class="btn small" data-action="back">⌫</button>
            <button class="btn small" data-action="negative">+/-</button>
            <button class="btn op" data-op="/">÷</button>

            <button class="btn" data-num="7">7</button>
            <button class="btn" data-num="8">8</button>
            <button class="btn" data-num="9">9</button>
            <button class="btn op" data-op="*">×</button>

            <button class="btn" data-num="4">4</button>
            <button class="btn" data-num="5">5</button>
            <button class="btn" data-num="6">6</button>
            <button class="btn op" data-op="-">−</button>

            <button class="btn" data-num="1">1</button>
            <button class="btn" data-num="2">2</button>
            <button class="btn" data-num="3">3</button>
            <button class="btn op" data-op="+">+</button>

            <button class="btn zero" data-num="0">0</button>
            <button class="btn" data-num=".">.</button>
            <button class="btn eq" data-action="equal">=</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
