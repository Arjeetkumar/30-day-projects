<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Lyrics VISUALIZER By Arjeet</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-wave-square"></i> NEON<span>VISUALIZER</span>
        </div>

        <div class="control-group">
            <label>1. Audio Source</label>
            <div class="file-box">
                <span id="fileName">Click to Upload MP3</span>
                <input type="file" id="audioFile" accept="audio/*">
            </div>
        </div>

        <div class="control-group">
            <label>2. Synced Lyrics (LRC)</label>
            <!-- Updated placeholder to show user format -->
            <textarea id="lyricsInput" placeholder="Paste LRC format here:&#10;[00:12.50] Verse one lines...&#10;[00:15.00] Next line here..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn btn-apply" id="applyBtn">Load Lyrics</button>
            <button class="btn btn-ai" id="aiBtn">✨ Demo Sync</button>
        </div>

        <div class="slider-container">
            <label>Text Size</label>
            <input type="range" id="textSize" min="20" max="120" value="60">
        </div>
        <div class="slider-container">
            <label>Glow Power</label>
            <input type="range" id="glowPower" min="0" max="50" value="20">
        </div>

        <div class="controls-row">
            <button class="circle-btn" id="playBtn"><i class="fa-solid fa-play"></i></button>
            <button class="circle-btn" id="pauseBtn"><i class="fa-solid fa-pause"></i></button>
        </div>
    </aside>

    <main class="stage">
        <canvas id="canvas"></canvas>
        <div id="lyricsDisplay">LOAD A TRACK</div>
    </main>

    <audio id="audio"></audio>
    <script src="script.js"></script>
</body>
</html>
