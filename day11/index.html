<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit Quest | Level Up Your Life By Arjeet</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>Premium Habit Quest</h1>
          <div class="sub">Level Up Your Life</div>
        </div>
      </div>

      <div class="status-board">
        <!-- Points & Level -->
        <div class="glass-panel points-card">
          <div class="points-label">Total Score</div>
          <div id="pointsValue" class="points-value">0</div>

          <div class="level-info">
            <span id="levelText">Level 1</span>
            <span id="nextLevelText">100 XP to next</span>
          </div>
          <div class="level-bar">
            <div id="levelFill" class="level-fill"></div>
          </div>
        </div>

        <!-- Weekly Chart -->
        <div class="glass-panel chart-card">
          <div class="points-label">Last 7 Days</div>
          <div id="weeklyChart" class="chart-bars">
            <!-- Bars injected by JS -->
          </div>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <section class="controls">
      <div class="search-wrap">
        <input id="search" placeholder="Search habits... (Press /)" />
      </div>

      <div class="actions">
        <button id="newBtn" class="btn btn-primary">
          <span>+</span> New Habit
        </button>
        <button id="exportBtn" class="btn btn-icon" title="Export Data">💾</button>
        <button id="importBtn" class="btn btn-icon" title="Import Data">📂</button>
      </div>
    </section>

    <!-- Habits Grid -->
    <section id="grid" class="grid"></section>

    <!-- Editor Modal -->
    <div id="modal" class="modal">
      <div class="modal-panel">
        <h2 id="modalTitle">New Habit</h2>

        <div class="form-group">
          <label>Habit Name</label>
          <input id="name" placeholder="e.g. Meditate" autofocus />
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label>Daily Goal</label>
            <input id="goal" type="number" min="1" value="1" />
          </div>
          <div class="form-group">
            <label>Color Theme</label>
            <input id="color" type="color" value="#00f2ff" style="height:46px; padding:4px;" />
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label>Points per Action</label>
            <input id="pts" type="number" value="10" />
          </div>
          <div class="form-group">
            <label>Completion Bonus</label>
            <input id="bonus" type="number" value="50" />
          </div>
        </div>

        <div class="modal-actions">
          <button id="saveBtn" class="btn btn-primary" style="flex:1">Save Habit</button>
          <button id="cancelBtn" class="btn btn-icon">Cancel</button>
          <button id="deleteBtn" class="btn btn-icon" style="color:var(--danger)">Delete</button>
        </div>
      </div>
    </div>

    <input type="file" id="fileInput" hidden accept=".json">

  </main>

  <div id="floatRoot"></div>

</body>

</html>
